<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepMate — Practice zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  .cat-card{ cursor:pointer; transition: border-color .15s ease; }
  .cat-card:hover{ border-color: var(--amber-dim); }
  .cat-card .val{ font-family:var(--f-mono); font-size:1.3rem; }

  #quizArea{ max-width: 640px; }
  .q-progress{ font-family:var(--f-mono); font-size:.8rem; color:var(--text-faint); margin-bottom: var(--s-3); }
  .option-btn{
    display:block; width:100%; text-align:left;
    margin-bottom: var(--s-2);
    background: var(--ink-2);
  }
  .option-btn.correct{ border-color: var(--green); color: var(--green); }
  .option-btn.wrong{ border-color: var(--red); color: var(--red); }
  .option-btn:disabled{ cursor:default; }

  #resultArea .val{ font-family:var(--f-mono); font-size:2.5rem; font-weight:700; }
  #hidden-panels{ display:none; }
</style>
</head>
<body>
  <div class="app-shell">
    <nav class="deck-nav">
      <div class="brand">Prep<span class="dot">Mate</span></div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="practice.html" class="active">Practice zone</a>
        <a href="interview.html">Mock interview</a>
        <a href="planner.html">Study planner</a>
        <a href="report.html">Progress report</a>
      </div>
      <div class="nav-foot">
        <span id="navUserName">—</span>
        <button class="btn-ghost btn-block" id="logoutBtn">Sign out</button>
      </div>
    </nav>

    <main class="deck-main">
      <header class="deck-header">
        <div>
          <div class="kicker">Practice zone</div>
          <h1>Choose a category</h1>
        </div>
      </header>

      <div class="grid grid-2" id="categoryGrid"></div>

      <section id="quizArea" style="display:none; margin-top: var(--s-6);">
        <div class="panel">
          <div class="q-progress" id="qProgress"></div>
          <h3 id="qText"></h3>
          <div id="qOptions"></div>
        </div>
      </section>

      <section id="resultArea" class="panel" style="display:none; margin-top: var(--s-6); max-width:640px; text-align:center;">
        <div class="kicker">Result</div>
        <div class="val" id="resultScore"></div>
        <p id="resultMsg"></p>
        <div style="display:flex; gap:var(--s-3); justify-content:center;">
          <button class="btn btn-primary" id="retryBtn">Try again</button>
          <a class="btn" href="practice.html">Back to categories</a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/content.js"></script>
  <script src="js/readiness.js"></script>
  <script>
    Store.requireAuth();
    const user = Store.currentUser();
    document.getElementById("navUserName").textContent = user.name;
    document.getElementById("logoutBtn").addEventListener("click", ()=>{ Store.logout(); window.location.href="index.html"; });

    const grid = document.getElementById("categoryGrid");
    const data = Store.getData();

    Object.keys(QUIZ_BANK).forEach(cat=>{
      const avg = Readiness.quizAverageByCategory(data, cat);
      const el = document.createElement("div");
      el.className = "panel cat-card";
      el.innerHTML = `
        <span class="tag tag-amber">${QUIZ_BANK[cat].length} questions</span>
        <h3 style="margin-top:var(--s-3);">${QUIZ_CATEGORY_LABELS[cat]}</h3>
        <p>${avg===null ? "Not attempted yet." : "Your average so far: "+avg+"%"}</p>
        <span class="val">${avg===null ? "—" : avg+"%"}</span>
      `;
      el.addEventListener("click", ()=> startQuiz(cat));
      grid.appendChild(el);
    });

    let current = { category:null, index:0, score:0, questions:[] };

    function startQuiz(cat){
      current = { category:cat, index:0, score:0, questions: QUIZ_BANK[cat] };
      grid.style.display = "none";
      document.getElementById("resultArea").style.display = "none";
      document.getElementById("quizArea").style.display = "block";
      renderQuestion();
    }

    function renderQuestion(){
      const q = current.questions[current.index];
      document.getElementById("qProgress").textContent =
        QUIZ_CATEGORY_LABELS[current.category].toUpperCase() + " — QUESTION " + (current.index+1) + " / " + current.questions.length;
      document.getElementById("qText").textContent = q.q;
      const optsEl = document.getElementById("qOptions");
      optsEl.innerHTML = "";
      q.options.forEach((opt, i)=>{
        const b = document.createElement("button");
        b.className = "option-btn";
        b.textContent = opt;
        b.addEventListener("click", ()=> selectAnswer(i));
        optsEl.appendChild(b);
      });
    }

    function selectAnswer(i){
      const q = current.questions[current.index];
      const buttons = document.querySelectorAll("#qOptions .option-btn");
      buttons.forEach(b=>b.disabled = true);
      buttons[q.a].classList.add("correct");
      if(i !== q.a){ buttons[i].classList.add("wrong"); } else { current.score++; }

      setTimeout(()=>{
        current.index++;
        if(current.index < current.questions.length){
          renderQuestion();
        }else{
          finishQuiz();
        }
      }, 700);
    }

    function finishQuiz(){
      document.getElementById("quizArea").style.display = "none";
      const pct = Math.round((current.score / current.questions.length) * 100);
      Store.recordQuiz(current.category, current.score, current.questions.length);
      document.getElementById("resultArea").style.display = "block";
      document.getElementById("resultScore").textContent = current.score + " / " + current.questions.length;
      let msg = pct >= 75 ? "Strong round — keep this pace up." :
                pct >= 45 ? "Decent, but there's clear room to tighten this up." :
                "This category needs focused revision before your next attempt.";
      document.getElementById("resultMsg").textContent = msg + " Saved to your progress report.";
    }

    document.getElementById("retryBtn").addEventListener("click", ()=> startQuiz(current.category));
  </script>
</body>
</html>
