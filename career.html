
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepMate | Choose Your Career</title>
  <link rel="stylesheet" href="css/base.css">

  <style>
    .career-page {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: auto;
      padding: 35px 24px 70px;
    }

    .career-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 55px;
    }

    .career-heading {
      text-align: center;
      margin-bottom: 40px;
    }

    .career-heading h1 {
      font-size: clamp(28px, 4vw, 44px);
      margin: 12px 0;
    }

    .career-heading p {
      margin: auto;
    }

    .career-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .career-card {
      text-align: left;
      min-height: 225px;
      padding: 22px;
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      cursor: pointer;
      transition: .2s ease;
    }

    .career-card:hover {
      border-color: var(--amber-dim);
      transform: translateY(-3px);
    }

    .career-card.selected {
      border-color: var(--amber);
      background: #252b2b;
      box-shadow: 0 0 0 1px var(--amber);
    }

    .career-icon {
      display: block;
      font-size: 34px;
      margin-bottom: 18px;
    }

    .career-card h3 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .career-card p {
      font-size: 13px;
      line-height: 1.6;
    }

    .selection {
      display: block;
      margin-top: 15px;
      font-size: 12px;
      color: var(--amber);
    }

    .career-details {
      margin-top: 28px;
      padding: 25px;
      border: 1px solid var(--amber-dim);
      border-radius: 10px;
      background: var(--panel);
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill-tag {
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--ink-2);
      color: var(--text-dim);
      font-size: 13px;
    }

    .career-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 30px;
    }

    #continueBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    @media (max-width: 1000px) {
      .career-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .career-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="career-page">

    <header class="career-top">
      <div class="brand">
        Prep<span class="dot">Mate</span>
      </div>

      <a href="dashboard.html" class="btn btn-ghost">
        Dashboard →
      </a>
    </header>

    <section class="career-heading">
      <span class="tag tag-amber">
        PERSONALIZE YOUR JOURNEY
      </span>

      <h1>
        Choose Your
        <span style="color:var(--amber)">Career Path</span>
      </h1>

      <p>
        Select the role you want to prepare for.
        You can change it anytime.
      </p>
    </section>

    <section class="career-grid"
             id="careerGrid"
             aria-label="Available career paths">
    </section>

    <section class="career-details"
             id="careerDetails"
             hidden>
      <h2 id="selectedCareerName"></h2>
      <p>Skills covered in this career path:</p>
      <div class="skill-tags" id="careerSkills"></div>
    </section>

    <div class="career-footer">
      <p id="selectionMessage">
        Select a career path to continue.
      </p>

      <button id="continueBtn"
              class="btn btn-primary"
              disabled>
        Continue to Dashboard →
      </button>
    </div>

  </main>

  <script src="js/store.js"></script>
  <script src="js/career.js"></script>

  <script>
    Store.requireAuth();

    let selectedCareer = null;

    const grid = document.getElementById("careerGrid");
    const details = document.getElementById("careerDetails");
    const continueBtn = document.getElementById("continueBtn");

    function selectCareer(career) {
      selectedCareer = career;

      document.querySelectorAll(".career-card")
        .forEach(card => {
          const active = card.dataset.id === career.id;

          card.classList.toggle("selected", active);
          card.setAttribute("aria-pressed", String(active));

          card.querySelector(".selection").textContent =
            active ? "✓ Selected" : "Select career";
        });

      document.getElementById("selectedCareerName")
        .textContent = career.name;

      const skillContainer =
        document.getElementById("careerSkills");

      skillContainer.replaceChildren();

      career.skills.forEach(skill => {
        const tag = document.createElement("span");
        tag.className = "skill-tag";
        tag.textContent = skill;
        skillContainer.appendChild(tag);
      });

      details.hidden = false;
      continueBtn.disabled = false;

      document.getElementById("selectionMessage")
        .textContent = "Selected: " + career.name;
    }

    CAREER_PATHS.forEach(career => {
      const card = document.createElement("button");

      card.type = "button";
      card.className = "career-card";
      card.dataset.id = career.id;
      card.setAttribute("aria-pressed", "false");

      const icon = document.createElement("span");
      icon.className = "career-icon";
      icon.textContent = career.icon;

      const title = document.createElement("h3");
      title.textContent = career.name;

      const description = document.createElement("p");
      description.textContent = career.description;

      const selection = document.createElement("span");
      selection.className = "selection";
      selection.textContent = "Select career";

      card.append(icon, title, description, selection);

      card.addEventListener("click", () => {
        selectCareer(career);
      });

      grid.appendChild(card);
    });

    const savedCareer = Store.getCareerPath();

    if (savedCareer) {
      const previous = CAREER_PATHS.find(
        career => career.id === savedCareer
      );

      if (previous) selectCareer(previous);
    }

    continueBtn.addEventListener("click", () => {
      if (!selectedCareer) return;

      const saved = Store.setCareerPath(
        selectedCareer.id,
        selectedCareer.name
      );

      if (saved) {
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("selectionMessage")
          .textContent = "Unable to save. Please sign in again.";
      }
    });
  </script>
</body>
</html>
